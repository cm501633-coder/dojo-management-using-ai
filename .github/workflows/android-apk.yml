name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install JavaScript dependencies
        working-directory: android
        run: npm ci

      - name: Generate Android project
        working-directory: android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        working-directory: android/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dojo-management-android-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
